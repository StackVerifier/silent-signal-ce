# pnpm settings.
#
# pnpm 10 no longer reads the `pnpm` field in package.json — a setting left
# there is silently ignored, which is worse than not having it, because the
# lockfile then differs depending on who ran the install.

# Do not install a version published less than 24 hours ago (value is minutes).
#
# A compromised publish is usually caught and unpublished within hours, so
# waiting a day removes most of that window at almost no cost — nothing here
# needs a release the day it ships. It also keeps the lockfile installable for
# anyone running the same policy: a `pnpm add` that quietly pulled in a
# hours-old release would fail their supply-chain check, not ours.
minimumReleaseAge: 1440

overrides:
  hono: 4.12.25

# ─── Install scripts ──────────────────────────────────────────────────────────
#
# pnpm will not run a dependency's install script unless it is named here — a
# package that runs arbitrary code at install time is exactly how a compromised
# release does damage, so the allow-list is the point, not an annoyance.
#
# The decision is spelled twice because pnpm 10 and 11 read different keys.
# pnpm 11 wants `allowBuilds` and errors on an unlisted package; pnpm 10 wants
# the two list-shaped keys and ignores `allowBuilds` entirely. Keeping both
# means the repository installs cleanly on either — `packageManager` in
# package.json pins the version anyway, but a stray global pnpm should not turn
# into a failed install.
#
# esbuild, sharp and unrs-resolver each link a platform-specific native binary
# that they cannot run without. msw is refused: its script only writes a
# service worker for browser request mocking, which nothing here uses.

# pnpm 11
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false

# pnpm 10
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

ignoredBuiltDependencies:
  - msw
