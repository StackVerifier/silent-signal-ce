# pnpm settings.
#
# pnpm 10 no longer reads the `pnpm` field in package.json — a setting left
# there is silently ignored, which is worse than not having it, because the
# lockfile then differs depending on who ran the install.

# Do not install a version published less than 24 hours ago (value is minutes).
#
# A compromised publish is usually caught and unpublished within hours, so
# waiting a day removes most of that window at almost no cost — nothing here
# needs a release the day it ships. It also keeps the lockfile installable for
# anyone running the same policy: a `pnpm add` that quietly pulled in a
# hours-old release would fail their supply-chain check, not ours.
minimumReleaseAge: 1440

overrides:
  hono: 4.12.25

# pnpm 10 refuses to run a dependency's install scripts unless it is named
# here — a package that runs arbitrary code at install time is exactly how a
# compromised release does damage, so the allow-list is the point.
#
# These three ship a platform-specific native binary that their install script
# links; without it the tool does not run. `msw` is deliberately absent: its
# script only writes a service worker for browser mocking, which nothing here
# uses.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Seen and deliberately not built. `msw` arrives via vitest and shadcn; its
# install script only writes a browser service worker for request mocking,
# which nothing here uses. Listing it records the decision so the install does
# not stop to ask on every machine.
ignoredBuiltDependencies:
  - msw
