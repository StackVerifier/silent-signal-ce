name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push makes the in-flight run of the same branch irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22 is the floor: the help database uses the built-in `node:sqlite`.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each step reports separately, so a red run says which gate failed
      # without anyone opening the log.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Deterministic, so a run never depends on a key left in the runner
          # environment. No real credential belongs in CI.
          ENCRYPTION_KEY: '0000000000000000000000000000000000000000000='
